server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://digital-circuit-simulator.railway.internal:8080;
        proxy_http_version 1.1;
        proxy_set_header Host digital-circuit-simulator.railway.internal;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
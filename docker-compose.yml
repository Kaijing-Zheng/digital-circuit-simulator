services:
  postgres:
    image: postgres:17
    container_name: circuit-sim-postgres
    environment:
      POSTGRES_DB: circuit_simulator
      POSTGRES_USER: circuitsim
      POSTGRES_PASSWORD: circuitsim
    ports:
      - "5432:5432"
    volumes:
      - circuit_sim_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U circuitsim -d circuit_simulator"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: circuit-sim-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/circuit_simulator
      SPRING_DATASOURCE_USERNAME: circuitsim
      SPRING_DATASOURCE_PASSWORD: circuitsim
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"

  frontend:
    build: ./frontend
    container_name: circuit-sim-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  circuit_sim_postgres_data: